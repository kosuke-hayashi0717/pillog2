<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f5f7"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="ピルログ"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.png"><title>ピルログ</title><style>
:root{--accent:#ff4e94;--soft:#ffe7f1;--ink:#202342;--bg:#fff1fa;--edge:#f6d9eb;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;color:var(--ink);background:var(--bg)}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 92% 9%,#fff 0 4%,transparent 14%),linear-gradient(155deg,#ffe5ee,#f3eaff 57%,#e9f2ff);min-height:100dvh}button,input{font:inherit}button{cursor:pointer}main{max-width:540px;margin:auto;padding:calc(env(safe-area-inset-top) + 25px) 19px 125px;min-height:100dvh}.eyebrow{font-size:14px;color:#827e9b;font-weight:700}h1{font-size:34px;letter-spacing:-1px;margin:8px 0 24px;color:#1c2042}h2{font-size:20px;margin:0 0 14px}.card{background:#fffffff0;border-radius:28px;padding:21px;margin-bottom:18px;box-shadow:0 5px 16px #7c5c9b13;border:1px solid #ffffff}.summary{background:#fff;padding:22px}.big{font-size:44px;font-weight:800;letter-spacing:-2px}.sub{font-size:14px;color:#89879b;margin-top:4px}.progress{height:12px;border-radius:15px;background:#e9e8ef;margin-top:17px;overflow:hidden}.progress>div{height:100%;background:#3886ff;transition:width .25s}.dose{display:flex;align-items:center;gap:13px;padding:17px 0;border-bottom:1px solid #eeeaf1}.dose:last-child{border:0;padding-bottom:0}.dose:first-child{padding-top:0}.symbol{width:56px;height:56px;display:grid;place-items:center;font-size:32px;background:#fff7e2;border-radius:18px}.dose:nth-child(2) .symbol{background:#eeeaff}.dose-text{flex:1;min-width:0}.dose-title{font-size:18px;font-weight:750}.dose-sub{font-size:13px;color:#848498;margin-top:5px}.take{border:0;border-radius:30px;background:#3184ff;color:#fff;padding:12px 15px;font-size:14px;font-weight:750;white-space:nowrap;min-height:44px}.take.done{background:#e5f9e7;color:#25963d}.tabs{position:fixed;bottom:0;left:0;right:0;background:#ffffffee;backdrop-filter:blur(18px);border-top:1px solid #f2dbe9;padding:12px 10px calc(env(safe-area-inset-bottom) + 11px);display:flex;justify-content:center;gap:10px;z-index:2}.tab{width:min(30%,150px);border:0;background:none;color:#8b8997;display:flex;align-items:center;flex-direction:column;gap:5px;font-size:12px;min-height:51px}.tab span{font-size:25px}.tab.active{color:var(--accent);font-weight:800}.hidden{display:none}.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.calhead button{background:#fff0f8;color:var(--accent);border:0;border-radius:12px;padding:8px 15px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.weekday{font-size:12px;color:#999;padding:5px 0}.day{border:0;background:transparent;border-radius:14px;aspect-ratio:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:2px;font-size:14px;color:#30334d}.day.selected{background:var(--accent);color:white}.day.today{outline:2px solid var(--accent)}.dots{font-size:10px;letter-spacing:1px;height:10px;color:#36bb54}.day.selected .dots{color:white}.muted{color:#b9b9bf}.setting{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:15px 0;border-bottom:1px solid #eee}.setting:last-child{border:0}.setting input{border:0;background:#fff1f8;border-radius:12px;padding:10px;color:var(--accent);max-width:130px}.small{font-size:13px;color:#838199;line-height:1.6}.secondary{border:0;border-radius:14px;background:#fff0f8;color:var(--accent);padding:12px 14px;font-weight:700;min-height:44px}.danger{color:#e23d52}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.section-label{font-size:13px;color:#8e8e93;margin:10px 0}.empty{padding:18px;color:#8e8e93;text-align:center;font-size:14px}dialog{border:0;border-radius:26px;padding:24px;width:min(90vw,380px);box-shadow:0 20px 80px #0003}dialog::backdrop{background:#0006}dialog input{width:100%;padding:13px;border:1px solid #ddd;border-radius:12px;margin:12px 0}dialog menu{display:flex;gap:10px;padding:0;margin:15px 0 0}dialog menu button{flex:1}button:focus-visible,input:focus-visible{outline:3px solid #ff8dbc;outline-offset:2px}.hero{display:flex;align-items:center;justify-content:space-between;min-height:125px}.hero h1{margin:0 0 7px}.cat{width:145px;height:125px;flex-shrink:0;overflow:hidden;border-radius:30px;filter:drop-shadow(0 5px 5px #f6a8bd55);transform:rotate(-5deg);background:#fff}.cat img{width:100%;height:100%;object-fit:cover;object-position:72% 44%}.date-pill{display:inline-block;background:#ffffffc9;border-radius:40px;padding:12px 16px;font-weight:750;box-shadow:0 4px 12px #b06a9014}.theme-row{display:flex;justify-content:space-between;gap:7px;padding:10px 0}.swatch{width:42px;height:42px;border-radius:50%;border:3px solid white;box-shadow:0 0 0 1px #ddd;min-height:42px}.swatch[aria-pressed=true]{outline:3px solid var(--accent);outline-offset:2px}.cat-note{text-align:center;font-size:17px;font-weight:700;color:#786f92;margin:20px 0}.complete{border-color:#b3f4b8}.complete .symbol{background:#e9ffea}.clouds{height:28px;background:radial-gradient(circle at 10% 100%,white 0 24px,transparent 25px),radial-gradient(circle at 38% 100%,white 0 30px,transparent 31px),radial-gradient(circle at 70% 100%,white 0 25px,transparent 26px)}@media(max-width:360px){main{padding-left:12px;padding-right:12px}.take{padding:10px}.dose-title{font-size:16px}.symbol{width:46px;height:46px}}
</style></head><body><main><section id="home"><div class="hero"><div><h1>💊 ピルログ</h1><div class="date-pill" id="todayLabel"></div></div><div class="cat" aria-hidden="true"><img src="./cat-illustration.webp" alt="" decoding="async"></div></div><div class="card summary"><div class="eyebrow">今日の服用</div><div class="big"><span id="count">0</span><span style="font-size:22px;color:#9b91af"> / 2回</span></div><div class="sub" id="summaryText">記録を確認しよう</div><div class="progress"><div id="bar" style="width:0%"></div></div></div><h2>☀️ 今日のスケジュール</h2><div class="card" id="todayDoses"></div><div class="cat-note" id="catNote">🐾 今日も一緒にコツコツ続けよう！</div><p class="small">記録はこの端末内に保存されます。飲み忘れ時の服用方法は医師・薬剤師の指示を確認してください。</p></section><section id="history" class="hidden"><div class="eyebrow">🐱 毎日のがんばりをチェック</div><h1>履歴</h1><div class="card"><div class="calhead"><button id="prev" aria-label="前の月">‹</button><strong id="monthLabel"></strong><button id="next" aria-label="次の月">›</button></div><div class="calendar" id="calendar"></div></div><div class="card"><h2 id="selectedLabel"></h2><div id="selectedDoses"></div></div></section><section id="settings" class="hidden"><div class="eyebrow">🌈 自分好みにカスタマイズ</div><h1>設定</h1><div class="card"><h2>服用予定時刻</h2><div class="setting"><label for="morning">☀️ 朝</label><input type="time" id="morning"></div><div class="setting"><label for="evening">🌙 夜</label><input type="time" id="evening"></div><p class="small">時刻は予定の目安です。端末への自動通知はこのバージョンでは対応していません。</p></div><div class="card"><h2>🎨 テーマカラー</h2><div class="theme-row" id="themeRow"></div></div><div class="card"><h2>データ管理</h2><button class="secondary" id="export">記録をCSVで書き出す</button><p class="small">ブラウザデータを削除すると記録も消える場合があります。定期的な書き出しがおすすめです。</p></div></section></main><nav class="tabs" aria-label="画面切替"><button class="tab active" data-tab="home"><span>🏠</span>今日</button><button class="tab" data-tab="history"><span>🗓️</span>履歴</button><button class="tab" data-tab="settings"><span>⚙️</span>設定</button></nav><dialog id="editDialog"><h2 id="dialogTitle">服用時刻</h2><p class="small">実際に服用した時刻を記録できます。</p><input type="datetime-local" id="doseTime"><menu><button class="secondary" id="cancel">キャンセル</button><button class="take" id="save">保存</button></menu></dialog><script>
const KEY='pillog-v1';let state;try{state=JSON.parse(localStorage.getItem(KEY))||{}}catch{state={}};state.records ||= {};state.times ||= {morning:'08:00',evening:'20:00'};state.theme ||= 'pink';const $=id=>document.getElementById(id);const pad=n=>String(n).padStart(2,'0');const key=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;const localDateTime=d=>`${key(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}`;const today=()=>key(new Date());let selected=today(),view=new Date();view.setDate(1);const doses=[['morning','朝','☀️'],['evening','夜','🌙']];function persist(){localStorage.setItem(KEY,JSON.stringify(state))}function dateLabel(k){const [y,m,d]=k.split('-');return `${Number(m)}月${Number(d)}日`}function record(k,id){return state.records[k]?.[id]}function renderDoses(k,el){el.innerHTML='';for(const [id,label,emoji] of doses){const val=record(k,id);const item=document.createElement('div');item.className='dose'+(val?' complete':'');const icon=document.createElement('div');icon.className='symbol';icon.textContent=emoji;const info=document.createElement('div');info.className='dose-text';const title=document.createElement('div');title.className='dose-title';title.textContent=label;const sub=document.createElement('div');sub.className='dose-sub';sub.textContent=val?`服用済み · ${new Date(val).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})}`:`予定 ${state.times[id]}`;info.append(title,sub);const btn=document.createElement('button');btn.className='take'+(val?' done':'');btn.textContent=val?'✓ 編集':'💊 服用する';btn.onclick=()=>val?edit(k,id):take(k,id);item.append(icon,info,btn);el.append(item)}}function take(k,id){const now=new Date();const time=k===today()?now:new Date(`${k}T${state.times[id]}`);(state.records[k] ||= {})[id]=time.toISOString();persist();render()}let editing;function edit(k,id){editing={k,id};$('dialogTitle').textContent=`${dateLabel(k)}・${id==='morning'?'朝':'夜'}`;$('doseTime').value=localDateTime(new Date(record(k,id)));$('editDialog').showModal()}$('cancel').onclick=()=>$('editDialog').close();$('save').onclick=()=>{const val=$('doseTime').value;if(!val||!Number.isFinite(new Date(val).getTime()))return;const {k,id}=editing;(state.records[k] ||= {})[id]=new Date(val).toISOString();persist();$('editDialog').close();render()};const remove=document.createElement('button');remove.className='secondary danger';remove.textContent='この記録を取り消す';remove.style.marginTop='12px';remove.style.width='100%';remove.onclick=()=>{if(!editing||!confirm('この服用記録を取り消しますか？'))return;delete state.records[editing.k][editing.id];persist();$('editDialog').close();render()};$('editDialog').append(remove);
function renderCalendar(){const y=view.getFullYear(),m=view.getMonth();$('monthLabel').textContent=`${y}年${m+1}月`;$('calendar').innerHTML='';for(const w of ['日','月','火','水','木','金','土']){const el=document.createElement('div');el.className='weekday';el.textContent=w;$('calendar').append(el)}const offset=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();for(let i=0;i<offset;i++)$('calendar').append(document.createElement('div'));for(let d=1;d<=days;d++){const k=key(new Date(y,m,d)),n=doses.filter(([id])=>record(k,id)).length;const b=document.createElement('button');b.className='day'+(k===selected?' selected':'')+(k===today()?' today':'')+(k>today()?' muted':'');const num=document.createElement('span');num.textContent=d;const dots=document.createElement('span');dots.className='dots';dots.textContent=n===2?'● ●':n===1?'●':'';b.append(num,dots);b.onclick=()=>{selected=k;render()};$('calendar').append(b)}}function render(){const now=new Date();$('todayLabel').textContent=now.toLocaleDateString('ja-JP',{year:'numeric',month:'long',day:'numeric',weekday:'long'});const n=doses.filter(([id])=>record(today(),id)).length;$('count').textContent=n;$('bar').style.width=`${n*50}%`;$('summaryText').textContent=n===2?'今日もばっちり！ 🎉':n===1?'あと1回だよ！':'今日も忘れずに記録しよう';$('catNote').textContent=n===2?'🐱 えらい！今日もおつかれさま ♡':'🐾 今日も一緒にコツコツ続けよう！';renderDoses(today(),$('todayDoses'));renderCalendar();$('selectedLabel').textContent=`${dateLabel(selected)}の記録`;renderDoses(selected,$('selectedDoses'));applyTheme();$('morning').value=state.times.morning;$('evening').value=state.times.evening}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));for(const id of ['home','history','settings'])$(id).classList.toggle('hidden',id!==b.dataset.tab);render()});$('prev').onclick=()=>{view.setMonth(view.getMonth()-1);render()};$('next').onclick=()=>{view.setMonth(view.getMonth()+1);render()};for(const id of ['morning','evening'])$(id).onchange=e=>{if(e.target.value){state.times[id]=e.target.value;persist();render()}};$('export').onclick=()=>{const lines=['日付,区分,服用日時'];for(const k of Object.keys(state.records).sort())for(const [id,label] of doses){const val=record(k,id);if(val)lines.push(`${k},${label},${new Date(val).toLocaleString('ja-JP')}`)}const blob=new Blob(['\ufeff'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`ピルログ_${today()}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};const themes={pink:['#ff4e94','#fff1fa'],blue:['#31b8ed','#eaf8ff'],purple:['#8c79ee','#f3eeff'],green:['#56c88d','#edfff5'],yellow:['#e5a933','#fff9e6']};function applyTheme(){const [accent,bg]=themes[state.theme]||themes.pink;document.documentElement.style.setProperty('--accent',accent);document.documentElement.style.setProperty('--bg',bg);document.body.style.background=`linear-gradient(155deg,${bg},#f4efff 65%,#eaf5ff)`;document.querySelectorAll('.swatch').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.color===state.theme)))}for(const [name,[accent]] of Object.entries(themes)){const b=document.createElement('button');b.className='swatch';b.dataset.color=name;b.style.background=accent;b.setAttribute('aria-label',name+'テーマ');b.onclick=()=>{state.theme=name;persist();applyTheme()};$('themeRow').append(b)}render();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
